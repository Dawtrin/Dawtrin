name: Update profile art

on:
  schedule:
    # Runs everyday at 00:00 UTC (07:00 AM VN time)
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch contributions
        run: python scripts/fetch_contributions.py
        env:
          GITHUB_USERNAME: Dawtrin

      - name: Render heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: Commit and push updated heatmap
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
